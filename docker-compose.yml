services:
  db:
    image: postgres:16
    container_name: bookhub-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-bookhub}
      POSTGRES_USER: ${DB_USER:-bookhub}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-bookhub}
    ports:
      - "1515:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database/scripts:/docker-entrypoint-initdb.d

  backend:
    build: .
    container_name: bookhub-backend
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-bookhub}
      DB_USER: ${DB_USER:-bookhub}
      DB_PASSWORD: ${DB_PASSWORD:-bookhub}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-bookhub-development-secret}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-30}
    ports:
      - "8000:8000"
  
  frontend:
    build: ./frontend
    container_name: bookhub-frontend
    restart: unless-stopped
    depends_on:
    - backend
    ports:
    - "80:80"

volumes:
  postgres_data: