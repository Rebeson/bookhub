<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BookHub</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="bg-light">
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm py-3">
      <div class="container">
        <a class="navbar-brand fw-bold d-flex align-items-center" href="#">
          <span class="fs-3 me-2">📚</span> BookHub
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div
          class="collapse navbar-collapse justify-content-center"
          id="navbarNav"
        >
          <ul class="navbar-nav fs-6 fw-medium">
            <li class="nav-item px-2">
              <a
                class="nav-link active"
                href="#"
                id="nav-explorar"
                onclick="navigate('explorar')"
                >Explorar</a
              >
            </li>
            <li class="nav-item px-2">
              <a
                class="nav-link"
                href="#"
                id="nav-estante"
                onclick="navigate('estante')"
                >Minha Estante</a
              >
            </li>
            <li class="nav-item px-2">
              <a
                class="nav-link"
                href="#"
                id="nav-favoritos"
                onclick="navigate('favoritos')"
                >Favoritos</a
              >
            </li>
          </ul>
        </div>
        <div class="d-flex align-items-center" id="auth-section">
          <!-- Botões de Login/Cadastro (Injetados via JS) -->
        </div>
      </div>
    </nav>

    <main class="container my-5">
      <!-- Seção: Explorar -->
      <section id="explorar-section" class="page-section">
        <div class="row mb-4 align-items-center">
          <div class="col-md-6 mb-3 mb-md-0">
            <div class="input-group">
              <span class="input-group-text bg-white border-end-0"
                ><i class="fa-solid fa-magnifying-glass text-muted"></i
              ></span>
              <input
                type="text"
                id="searchInput"
                class="form-control border-start-0 ps-0"
                placeholder="Buscar por título, autor ou gênero..."
                onkeyup="filterBooks()"
              />
            </div>
          </div>
          <div class="col-md-3 mb-3 mb-md-0">
            <select
              id="genreFilter"
              class="form-select text-muted"
              onchange="filterBooks()"
            >
              <option value="Todos">Todos os Gêneros</option>
              <option value="FICÇÃO">Ficção</option>
              <option value="DESENVOLVIMENTO PESSOAL">
                Desenvolvimento Pessoal
              </option>
              <option value="ACADÊMICO E CIENTÍFICO">
                Acadêmico e Científico
              </option>
              <option value="NÃO-FICÇÃO">Não-Ficção</option>
              <option value="INFANTOJUVENIL">Infantojuvenil</option>
            </select>
          </div>
          <div class="col-md-3">
            <select class="form-select text-muted">
              <option>Melhores Avaliados</option>
              <option>Mais Recentes</option>
            </select>
          </div>
        </div>

        <div class="d-flex justify-content-between align-items-end mb-4">
          <h2 class="fw-bold m-0">Catálogo de Livros</h2>
          <small class="text-muted" id="book-count"
            >0 livro(s) encontrado(s)</small
          >
        </div>

        <div class="row" id="books-grid"></div>
      </section>

      <!-- Seção: Minha Estante -->
      <section id="estante-section" class="page-section d-none">
        <h2 class="fw-bold mb-4">Minha Estante</h2>
        <div class="row" id="shelf-grid"></div>
      </section>

      <!-- Seção: Favoritos -->
      <section id="favoritos-section" class="page-section d-none">
        <h2 class="fw-bold mb-4">Meus Favoritos</h2>
        <div class="row" id="fav-grid"></div>
      </section>
    </main>

    <!-- Login -->
    <div class="modal fade" id="loginModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Entrar</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body">
            <input
              type="email"
              id="loginEmail"
              class="form-control mb-3"
              placeholder="Email"
            />
            <input
              type="password"
              id="loginSenha"
              class="form-control mb-3"
              placeholder="Senha"
            />
            <button class="btn btn-primary w-100" onclick="login()">
              Entrar
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Cadastro -->
    <div class="modal fade" id="registerModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Cadastrar</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body">
            <input
              type="text"
              id="regNome"
              class="form-control mb-3"
              placeholder="Nome Completo"
            />
            <input
              type="email"
              id="regEmail"
              class="form-control mb-3"
              placeholder="Email"
            />
            <input
              type="tel"
              id="regTelefone"
              class="form-control mb-3"
              placeholder="Telefone"
            />
            <input
              type="password"
              id="regSenha"
              class="form-control mb-3"
              placeholder="Senha"
            />
            <button class="btn btn-success w-100" onclick="register()">
              Criar Conta
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
